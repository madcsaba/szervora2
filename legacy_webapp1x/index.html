<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szervóra – TCM wellness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif:wght@600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&text=%E5%BF%83%E6%9C%A8%E7%81%AB%E5%9C%9F%E9%87%91%E6%B0%B4%E8%83%86%E8%82%9D%E8%82%BA%E5%A4%A7%E8%82%A0%E8%83%83%E8%84%BE%E5%B0%8F%E8%86%80%E8%83%B1%E8%82%BE%E5%8C%85%E4%B8%89%E7%84%A6&display=swap">
<style>
/* VOICE: nyugodt, gondos, mint egy jól szerkesztett gyógytorna-füzet
   IDEA: a kínai szervóra és az Öt Elem kör; a test mint élő térkép
   PICTURE: az élő 24 órás szervgyűrű, a testen áramló meridián, a nagyítható testtérkép
   COLOUR and TYPE: meleg papír alap, az öt elem színei; Noto Serif címek, Noto Sans szöveg
   LAYOUT: telefonos oszlop, alsó navigáció, kártyák */
:root{--bg:#F6F1E7;--surf:#FFFDF8;--line:#E3DBC9;--ink:#1F2A2E;--muted:#5B6468;--chip:#ECE5D4;--jade:#2E6B5C;--jade-t:#2E6B5C;--warn:#FBEDE8;--warn-line:#E9C3B7;--body:#E8DECA;--body-line:#CDBF9F;--map:#EFE8DA;
--fa:#4F7F55;--fa-l:#DDE8DC;--fa-t:#3F6B45;--tuz:#B8452F;--tuz-l:#F3D9D1;--tuz-t:#A23B27;--fold:#9A6B14;--fold-l:#F0E2C4;--fold-t:#7F5810;--fem:#5F7079;--fem-l:#DDE3E6;--fem-t:#4D5C64;--viz:#2F5D7C;--viz-l:#D5E2EA;--viz-t:#2F5D7C;--er:#6B4F8A;--er-l:#E6DEEF;--er-t:#5E4479;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141A1C;--surf:#1D2528;--line:#2F3A3E;--ink:#ECE7DD;--muted:#A3ACAF;--chip:#263033;--jade:#2F7A66;--jade-t:#7CC7AF;--warn:#3A2420;--warn-line:#6B3A30;--body:#3A3F3B;--body-line:#55594F;--map:#192022;
--fa-l:#24352A;--fa-t:#8FC497;--tuz-l:#3D2420;--tuz-t:#F0907C;--fold-l:#3A2F18;--fold-t:#E0B460;--fem-l:#283136;--fem-t:#AEBCC4;--viz-l:#1E2E3A;--viz-t:#8DB8D8;--er-l:#2E2638;--er-t:#B9A3D6;color-scheme:dark}}
:root[data-theme=dark]{--bg:#141A1C;--surf:#1D2528;--line:#2F3A3E;--ink:#ECE7DD;--muted:#A3ACAF;--chip:#263033;--jade:#2F7A66;--jade-t:#7CC7AF;--warn:#3A2420;--warn-line:#6B3A30;--body:#3A3F3B;--body-line:#55594F;--map:#192022;
--fa-l:#24352A;--fa-t:#8FC497;--tuz-l:#3D2420;--tuz-t:#F0907C;--fold-l:#3A2F18;--fold-t:#E0B460;--fem-l:#283136;--fem-t:#AEBCC4;--viz-l:#1E2E3A;--viz-t:#8DB8D8;--er-l:#2E2638;--er-t:#B9A3D6;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Noto Sans',system-ui,sans-serif;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade-t);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px;position:relative}
.serif{font-family:'Noto Serif',serif;font-weight:600}
.han{font-family:'Noto Serif SC','Noto Serif',serif;font-weight:600}
.top{display:flex;align-items:center;gap:6px;padding:16px 16px 6px}
.top h1{margin:0;font-family:'Noto Serif',serif;font-weight:600;font-size:26px;line-height:1.2}
.top .sub{font-size:13px;color:var(--muted)}
.grow{flex:1}
.ibtn{width:44px;height:44px;flex:none;border-radius:22px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:22px}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surf);border:1px solid var(--line);border-radius:16px;min-height:56px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none;color:var(--jade-t)}
.row .t{display:block;font-size:15px;font-weight:600;line-height:20px}
.row .s{display:block;font-size:13px;color:var(--muted);line-height:18px}
.tag{display:block;font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--jade-t)}
h2{margin:0;font-size:16px;font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 0;gap:8px}
.sec span{font-size:12px;color:var(--muted)}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surf);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill[aria-pressed=true],.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{padding:8px 10px;border-radius:12px;background:var(--surf);border:1px solid var(--line)}
.tile .k{font-size:11px;color:var(--muted);line-height:15px}
.tile .v{font-size:14px;font-weight:600;line-height:19px}
.hero{margin:4px 16px 0;padding:18px 20px;border-radius:24px;color:#fff;position:relative;overflow:hidden}
.hero .big{font-family:'Noto Serif',serif;font-weight:600;font-size:34px;line-height:1.15}
.hero .bg{position:absolute;right:16px;top:0;font-size:100px;line-height:120px;color:rgba(255,255,255,.2)}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative}
.hero .chips span{padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.22);font-size:12px;font-weight:600}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:0;background:var(--jade);color:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:12px;line-height:17px;color:var(--muted);margin:8px 4px 0}
.warnbox{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--warn);border:1px solid var(--warn-line);font-size:14px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:24px;background:var(--surf);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.list{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.dot{width:9px;height:9px;border-radius:5px;flex:none;display:inline-block}
.echip{flex:none;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:72px;display:flex;background:var(--surf);border-top:1px solid var(--line);z-index:20}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted);text-align:center;line-height:1.2}
nav.tabs a[aria-current=page]{color:var(--jade-t);font-weight:600}
.clockwrap{position:relative;width:min(360px,92vw);aspect-ratio:1;margin:0 auto}
.clockwrap svg{width:100%;height:100%;display:block}
.clockwrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.seg:hover path{opacity:.85}
/* élő meridián */
.fbase{fill:none;stroke-width:4;opacity:.35;stroke-linecap:round;stroke-linejoin:round}
.fdots{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:.1 16;animation:flow 1.5s linear infinite}
.fcore{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.1 16;animation:flow 1.5s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-16.1}}
.livecard{display:flex;gap:12px;align-items:center;padding:10px 14px 10px 8px}
.livecard>svg{width:96px;height:150px;flex:none;display:block}
/* térkép */
.map{position:relative;height:min(58vh,520px);min-height:360px;margin:4px 16px 0;border-radius:20px;background:var(--map);border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.short{height:min(46vh,420px);min-height:320px}
.stage{position:absolute;left:0;top:0;width:310px;height:480px;transform-origin:0 0}
.stage svg{width:310px;height:480px;display:block}
.anim{transition:transform .35s ease}
.ptl{position:absolute;inset:0;pointer-events:none}
.pt{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center}
.pt i{display:block;width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.pt b{position:absolute;left:31px;top:13px;white-space:nowrap;padding:1px 6px;border-radius:8px;font-size:11px;font-weight:600;line-height:16px;background:var(--surf);color:var(--ink);box-shadow:0 0 0 1px var(--line);display:none}
.ptl.labels .pt b,.pt.sel b{display:block}
.pt.sel{z-index:3}.pt.sel i{width:19px;height:19px;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent)}
.pt.sel b{background:var(--c);color:#fff;box-shadow:none}
.pt.dim{opacity:.22}.pt.done i{opacity:.55}
.mapctl{position:absolute;right:8px;bottom:8px;z-index:5;display:flex;flex-direction:column;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:22px}
.mapctl button{width:44px;height:44px;border:0;background:transparent;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mapctl span{font-size:11px;font-weight:600;color:var(--muted)}
.mapview{position:absolute;left:8px;top:8px;z-index:5;display:flex;gap:4px}
.mapview .pill{min-height:36px;padding:0 12px}
.legend{position:absolute;left:8px;bottom:8px;z-index:5;max-width:min(260px,62%);display:flex;flex-wrap:wrap;gap:3px 10px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--surf) 92%,transparent);font-size:11px}
.legend span{display:flex;align-items:center;gap:4px}
.kv{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.kv .k{width:78px;flex:none;font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted);line-height:20px}
.kv .v{font-size:14px;line-height:20px}
.badge{flex:none;min-width:60px;height:60px;padding:0 8px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.breath{position:relative;width:min(280px,74vw);aspect-ratio:1;margin:8px auto 0}
.breath .r1,.breath .r2,.breath .core{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.breath .r1{width:100%;height:100%;background:var(--bl)}
.breath .r2{width:78%;height:78%;background:color-mix(in srgb,var(--bc) 30%,var(--bl))}
.breath .core{width:56%;height:56%;background:var(--bc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translate(-50%,-50%) scale(.6)}
.breath .core .n{font-family:'Noto Serif',serif;font-weight:600;font-size:48px;line-height:1.1}
.prog{height:6px;border-radius:3px;background:var(--line)}
.prog i{display:block;height:6px;border-radius:3px;background:var(--jade);width:0}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:#9C9584;position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.switch:checked{background:var(--jade)}
.switch:checked::after{left:23px}
.ring{width:150px;height:150px;margin:0 auto;display:block}
.fig2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fig2 figure{margin:0;background:var(--map);border:1px solid var(--line);border-radius:16px;padding:6px;text-align:center}
.fig2 figcaption{font-size:12px;color:var(--muted)}
.fig2 svg{width:100%;height:auto;display:block}
.banner{margin:10px 16px 0;padding:10px 12px;border-radius:14px;background:var(--chip);font-size:13px;line-height:18px;display:flex;gap:10px;align-items:flex-start}
.banner button{flex:none;border:0;background:transparent;font-weight:600;color:var(--jade-t);min-height:32px;cursor:pointer}
.seg2{display:flex;gap:6px}.seg2 .pill{flex:1}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{min-width:34px;height:30px;padding:0 8px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--bg)}.steps span.ok{background:var(--jade);color:#fff}
.bigtime{font-family:'Noto Serif',serif;font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
:root{--bone:#FFFDF6;--bone-line:#A99B7C}
:root[data-theme=dark]{--bone:#CFC8B8;--bone-line:#7E7766}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bone:#CFC8B8;--bone-line:#7E7766}}
.bo{stroke:var(--bone-line);fill:none;stroke-linecap:round}.bf{stroke:var(--bone);fill:none;stroke-linecap:round}
.bs{fill:var(--bone);stroke:var(--bone-line);stroke-width:1}.br{stroke:var(--bone-line);stroke-width:1.3;fill:none;stroke-linecap:round}.bh{fill:var(--bone-line);opacity:.55}
.mline{stroke:var(--jade-t);stroke-width:1.8;fill:none;stroke-linecap:round}.mtk{stroke:var(--jade-t);stroke-width:1.4}.mseg{stroke:var(--jade-t);stroke-width:1.2;opacity:.5;stroke-dasharray:3 3}
.mo{fill:none;stroke:var(--jade-t);stroke-width:1.6}.mt{font-weight:600;fill:var(--jade-t);stroke:var(--map);stroke-width:1.4px;paint-order:stroke;font-family:'Noto Sans',sans-serif}
.mbones{position:absolute;right:8px;top:8px;z-index:5;min-height:36px!important;padding:0 12px!important}
.nightchip{margin-top:4px;padding:2px 10px;border-radius:12px;background:var(--chip);font-size:11px;font-weight:600;color:var(--muted)}
.area{font-family:'Noto Serif',serif;font-weight:600;font-size:21px;line-height:1.25}
@media (prefers-reduced-motion:reduce){.anim,.breath .core{transition:none!important}.fdots,.fcore{animation:none}}
</style>
</head>

{

const C = (sec, key) => { const a = PACK[lang].c[sec], b = PACK.hu.c[sec]; if (key === undefined) return a || b; return (a && a[key] !== undefined) ? a[key] : b[key]; };

const orgN = (c) => C('org', c)[0];
const elT = (k) => C('el', k);
const chT = (c) => C('ch', c);

const num = (n) => n.toLocaleString(loc(), { maximumFractionDigits: 1 });

/* ================= ikonok ================= */
const IC = {

  body: '<circle cx="12" cy="4" r="2"/><path d="M8 8h8l-1 7h-1.5l-.5 6h-2l-.5-6H9z"/>', move: '<circle cx="12" cy="5" r="2"/><path d="M12 8v6M6 11l6-1 6 1M12 14l-4 6M12 14l4 6"/>',
  breath: '<path d="M3 9h10a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 17h6"/>', food: '<path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-1.5 1-1.5 1-3M13 7c0-1.5 1-1.5 1-3"/>',
  point: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>', emotion: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  herb: '<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/>', season: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  sleep: '<path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/>', book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 5v16M8 7h7"/>',
  hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7-2.5 0-4-1.5-5.5-4L4 13a1.5 1.5 0 0 1 2.5-1.5L8 13"/>',

function initTimer(signal) {
  let dur = 60, left = 60, run = false, last = 0, iv = null;
  const ring = $('#ringp'), txt = $('#ringt'), go = $('#tgo'), msg = $('#tmsg');
  const draw = () => { ring.setAttribute('stroke-dashoffset', (326.7 * (1 - left / dur)).toFixed(1)); txt.textContent = mmss(Math.ceil(left)); };
  const label = () => { go.innerHTML = `${ic(run ? 'pause' : 'play', 16, 2)}${t(run ? 'pause' : left < dur && left > 0 ? 'resume' : 'start')}`; };
  const stop = () => { run = false; clearInterval(iv); label(); };
  const tick = () => { const n = performance.now(); left -= (n - last) / 1000; last = n; if (left <= 0) { left = 0; draw(); stop(); msg.textContent = t('timer_done'); buzz([200, 100, 200]); beep(660, .25); return; } draw(); };
  $('#view').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === 'tgo') { if (run) { stop(); return; } audio(); if (left <= 0) left = dur; run = true; last = performance.now(); msg.textContent = t('timer_run'); label(); iv = setInterval(tick, 200); }
    if (a === 'treset') { stop(); left = dur; msg.textContent = ''; draw(); label(); }
    if (a === 'tdur') { stop(); dur = left = +b.dataset.k; $$('[data-act=tdur]').forEach((x) => x.setAttribute('aria-pressed', x === b)); msg.textContent = ''; draw(); label(); }
    if (a === 'tech') { tech = b.dataset.k; $$('[data-act=tech]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#techcard').innerHTML = techCard(); }
  }, { signal });
  signal.addEventListener('abort', () => clearInterval(iv));
  draw();
}

const buzz = (p) => { if (!store.get('vibrate', true)) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

function initBreath(signal) {

  const tick = () => { const n = performance.now(); elapsed += (n - last) / 1000; last = n; if (elapsed >= P()[i][1]) { elapsed = 0; i++; if (i >= P().length) { i = 0; cyc++; if (cyc >= brCycles) { finish(true); return; } } setPhase(P()[i][1]); } ui(); };
  const pause = () => { run = false; clearInterval(iv); const m = getComputedStyle(core).transform; core.style.transition = 'none'; if (m !== 'none') core.style.transform = m; go.innerHTML = `${ic('play', 16, 2)}${t('resume')}`; };

    if (a === 'brstop') finish(false);

function initRoutine(signal, id) {

function route() {
  const h = (location.hash.slice(1) || 'ora').toLowerCase();
  const i = h.indexOf('-'); let name = i < 0 ? h : h.slice(0, i); let arg = i < 0 ? '' : h.slice(i + 1);
  if (!V[name]) { name = 'ora'; arg = ''; }
  if (ac) ac.abort(); ac = new AbortController(); clearInterval(clockIv);
  document.documentElement.lang = lang;
  layout();
  $('#view').innerHTML = V[name](arg);
  const nav = $('#nav'); nav.setAttribute('aria-label', t('app'));
  nav.innerHTML = TABS.map(([href, n, icn]) => `<a href="#${href}"${GROUP[name] === href ? ' aria-current="page"' : ''}>${ic(icn, 24, GROUP[name] === href ? 2 : 1.7)}<span>${t(n)}</span></a>`).join('');
  if (h !== lastHash) window.scrollTo(0, 0); lastHash = h;
  const sig = ac.signal;
  if (name === 'atlasz') initAtlas(sig);
  if (name === 'pont') initTimer(sig);
  if (name === 'gyakorlat') initBreath(sig);
  if (name === 'rutin') initRoutine(sig, arg);
  if (name === 'ora') clockIv = setInterval(() => { if (!document.hidden) { const y = window.scrollY; $('#view').innerHTML = V.ora(); window.scrollTo(0, y); } }, 30000);
  document.title = `${t(TITLE[name])} – ${t('app')}`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'dismiss') { store.set('seenInfo', true); b.closest('.banner').remove(); }
  if (a === 'cyc') { elemCyc = b.dataset.k; $$('[data-act=cyc]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#cycfig').innerHTML = cycleSvg(elemCyc); $('#cyctext').innerHTML = cycText(); }
  if (a === 'lexel') { lexEl = b.dataset.k; $$('[data-act=lexel]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#lexlist').innerHTML = lexList(); }
  if (a === 'jmode') { jMode = b.dataset.k; $$('[data-act=jmode]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#jlist').innerHTML = jList(); }
  if (a === 'lyreset') { L = Object.assign({}, DEFAULT_LAYERS); store.set('layers', L); route(); }
  if (a === 'lang') { lang = b.dataset.k; store.set('lang', lang); route(); }
  if (a === 'model') { MODEL = b.dataset.k; store.set('model', MODEL); route(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'lexq') { lexQ = e.target.value; $('#lexlist').innerHTML = lexList(); }
  if (e.target.id === 'jq') { jQ = e.target.value; $('#jlist').innerHTML = jList(); }
});
document.addEventListener('change', (e) => { const k = e.target.dataset && e.target.dataset.layer; if (!k) return; L[k] = e.target.checked; store.set('layers', L); });
window.addEventListener('hashchange', route);
route();
}
</script>
</body>
</html>
