<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6FBF6">
<title>Szervóra 2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&text=%E5%BF%83%E6%9C%A8%E7%81%AB%E5%9C%9F%E9%87%91%E6%B0%B4%E8%83%86%E8%82%9D%E8%82%BA%E5%A4%A7%E8%82%A0%E8%83%83%E8%84%BE%E5%B0%8F%E8%86%80%E8%83%B1%E8%82%BE%E5%8C%85%E4%B8%89%E7%84%A6&display=swap">
<style>
/* VOICE: nyugodt, gondos, rövid mondatok – egy jó gyógytornász hangja
   IDEA: az idő színe – a mostani szerv eleme színezi az egész felületet, este sötétre vált
   PICTURE: a nap szervszalagja, rétegezhető test, csukott szemmel is követhető lejátszó, tudásgráf
   COLOUR and TYPE: tonális elem-paletták (M3 Expressive szellemben), Inter Tight címek, Inter szöveg
   LAYOUT: telefonos oszlop, lebegő alsó navigáció, nagy kerekítés, egy fő teendő képernyőnként */
:root{color-scheme:light;--r-xl:28px;--r-l:20px;--r-m:16px}
:root[data-mode=d]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--on);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;transition:background-color .6s ease,color .6s ease}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:104px;position:relative}
body.immersive #app{padding-bottom:0}
body.immersive nav.tabs{display:none}
.display{font-family:'Inter Tight',Inter,sans-serif;font-weight:700;letter-spacing:-.4px;margin:0}
.han{font-family:'Noto Serif SC',serif;font-weight:600}
.grow{flex:1}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{font-size:13px;color:var(--mut);line-height:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.1px;color:var(--mut);display:flex;align-items:center;gap:6px}
.eyebrow.acc{color:var(--acc)}
h2{margin:0;font-size:16px;font-weight:700}
/* fejléc */
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px}
.top h1{margin:0;font-family:'Inter Tight',Inter,sans-serif;font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.5px}
.iconbtn{width:48px;height:48px;flex:none;border-radius:24px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--on)}
.iconbtn.tonal{background:var(--surf2)}
.iconbtn[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
/* nap-szalag */
.arcwrap{position:relative;padding:4px 8px 0;margin-bottom:14px}
.arcwrap a path{transition:opacity .2s}.arcwrap a:hover path{opacity:.9}
.arccenter{position:absolute;left:0;right:0;bottom:6px;text-align:center;pointer-events:none}
.arccenter .organ{font-family:'Inter Tight',Inter,sans-serif;font-weight:800;line-height:1.05;letter-spacing:-1px;margin:4px 0 2px}
.arccenter .eyebrow{justify-content:center;color:var(--acc)}
/* kártyák */
.card{background:var(--surf);border-radius:var(--r-l);padding:16px}
.card.quiet{background:var(--surf2)}
.card .t,.row .t,.rcard .t{display:block;font-size:16px;font-weight:600;line-height:21px}
.card .s,.row .s,.rcard .s{display:block;font-size:14px;color:var(--mut);line-height:20px;margin-top:2px}
.hero{background:var(--cont);border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden}
.hero p{margin:6px 0 0;font-size:15px;line-height:22px;color:var(--on)}
.hero .display{font-size:26px;line-height:31px;margin-top:6px}
.hero .t{font-size:17px;font-weight:700}
.hero .bgglyph{position:absolute;right:14px;top:-6px;font-size:110px;line-height:1;color:var(--acc);opacity:.13;pointer-events:none}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.hero .chips span{padding:5px 12px;border-radius:14px;background:var(--surf);font-size:13px;font-weight:600}
.hero.solid{margin:4px 16px 0;color:#fff;background:var(--acc)}
.hero.solid .big{font-family:'Inter Tight',Inter,sans-serif;font-weight:800;font-size:36px;line-height:1.1}
.hero.solid .bg{position:absolute;right:16px;top:0;font-size:100px;line-height:120px;opacity:.22}
.hero.solid .chips span{background:rgba(0,0,0,.22);color:#fff}
:root[data-mode=d] .hero.solid{color:#10140F}
:root[data-mode=d] .hero.solid .chips span{background:rgba(255,255,255,.35);color:#10140F}
.tag{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--acc);text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;background:var(--surf);border-radius:var(--r-l);min-height:64px;color:var(--on)}
.row.flat{background:var(--surf2)}
.ic{width:42px;height:42px;border-radius:14px;background:var(--surf2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--acc)}
.rcard{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surf);border-radius:var(--r-l)}
.rcard.hl{background:var(--cont)}
.rcard .meta{display:block;font-size:12px;font-weight:600;color:var(--acc);margin-top:4px}
.playdot{width:44px;height:44px;border-radius:22px;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;flex:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:8px 4px 0;gap:8px}
.sec span{font-size:12px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{padding:10px 12px;border-radius:var(--r-m);background:var(--surf);display:block}
.tile .k{font-size:11px;color:var(--mut);line-height:15px}
.tile .v{font-size:14px;font-weight:600;line-height:19px}
.tile.big .v{font-family:'Inter Tight',Inter,sans-serif;font-size:20px;font-weight:700;line-height:25px;margin-top:2px}
/* gombok */
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{min-height:52px;padding:0 22px;border-radius:26px;border:0;background:var(--acc);color:var(--onacc);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.tonal,.btn.ghost{background:var(--surf);color:var(--on)}
.card .btn.tonal,.hero .btn.tonal{background:var(--surf2)}
.hero .btn.tonal{background:var(--surf)}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:12px;line-height:17px;color:var(--mut);margin:8px 4px 0;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.warnbox{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--warn);border:1px solid var(--warn-line);font-size:14px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-radius:26px;background:var(--surf2);color:var(--mut)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--on);outline:none}
.list{background:var(--surf);border-radius:var(--r-l);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{display:block;font-size:15px;font-weight:600}.li .s{display:block;font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:5px;flex:none;display:inline-block}
.echip{flex:none;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;background:var(--surf);display:inline-flex;align-items:center}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:0;background:var(--surf2);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--on)}
.pill[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.pill[aria-pressed=true] .dot{box-shadow:0 0 0 2px var(--onacc)}
.seg{display:flex;gap:4px;padding:4px;border-radius:26px;background:var(--surf2)}
.seg>button,.seg>a{flex:1;min-height:44px;border:0;border-radius:22px;background:transparent;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px;color:var(--on)}
.seg>[aria-pressed=true],.seg>[aria-checked=true],.seg>[aria-selected=true]{background:var(--surf);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--acc)}
.card .seg{background:var(--bg)}
.field{margin-top:14px}.flabel{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;color:var(--mut)}
.kv{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kv .k{width:84px;flex:none;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--mut);line-height:20px;text-transform:uppercase}
.kv .v{font-size:14px;line-height:20px}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);border:2px solid var(--mut);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:10px;background:var(--mut);transition:all .15s}
.switch:checked{background:var(--acc);border-color:var(--acc)}
.switch:checked::after{left:22px;top:2px;width:24px;height:24px;border-radius:12px;background:var(--onacc)}
.swl{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.tinput{height:48px;border-radius:14px;border:0;background:var(--surf2);color:var(--on);font:inherit;font-size:16px;padding:0 12px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.crumbs a{padding:4px 12px;border-radius:12px;background:var(--surf);font-weight:600;color:var(--on);border-left:4px solid var(--dotc)}
.crumbs a.on{background:var(--cont)}
.tabs.seg>a{text-decoration:none}
/* alsó navigáció */
nav.tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;height:76px;display:flex;background:var(--surf);border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:20;padding:0 6px;transition:background-color .6s}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--mut);text-align:center;line-height:1.2}
nav.tabs .ind{width:58px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .2s}
nav.tabs a[aria-current=page]{color:var(--on)}
nav.tabs a[aria-current=page] .ind{background:var(--cont);color:var(--acc)}
/* check-in lap */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 20px 24px;z-index:41;animation:up .25s ease}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .hero{margin-top:16px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
/* testtérkép */
.map{position:relative;height:min(52vh,480px);min-height:360px;margin:4px 16px 0;border-radius:var(--r-xl);background:var(--map);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage{position:absolute;left:0;top:0;width:310px;height:480px;transform-origin:0 0}
.stage svg{width:310px;height:480px;display:block}
.stage .bg{transition:opacity .3s}
.anim{transition:transform .35s ease}
.ptl{position:absolute;inset:0;pointer-events:none}
.pt{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center}
.pt i{display:block;width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.pt b{position:absolute;left:31px;top:13px;white-space:nowrap;padding:1px 6px;border-radius:8px;font-size:11px;font-weight:600;line-height:16px;background:var(--surf);color:var(--on);box-shadow:0 0 0 1px var(--line);display:none}
.ptl.labels .pt b,.pt.sel b{display:block}
.pt.sel{z-index:3}.pt.sel i{width:19px;height:19px;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 35%,transparent)}
.pt.sel b{background:var(--c);color:var(--onel);box-shadow:none}
.pt.dim{opacity:.2}.pt.done i{opacity:.55}
.mapctl{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;align-items:center;background:var(--surf);border-radius:24px}
.mapctl button{width:46px;height:46px;border:0;background:transparent;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--on)}
.mapctl span{font-size:11px;font-weight:600;color:var(--mut)}
.mapview{position:absolute;left:10px;top:10px;z-index:5;display:flex;gap:4px;padding:4px;border-radius:24px;background:var(--surf)}
.mapview .pill{min-height:36px;padding:0 12px;background:transparent}
.mapview .pill[aria-pressed=true]{background:var(--acc)}
.layerbox{position:absolute;right:10px;top:10px;z-index:5;display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:22px;background:var(--surf)}
.layerbox button{width:62px;min-height:52px;border:0;border-radius:18px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;color:var(--mut)}
.layerbox button[aria-pressed=true]{background:var(--cont);color:var(--acc)}
/* élő meridián, csontváz, mérés */
.fbase{fill:none;stroke-width:4;opacity:.35;stroke-linecap:round;stroke-linejoin:round}
.fdots{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:.1 16;animation:flow 1.5s linear infinite}
.fcore{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.1 16;animation:flow 1.5s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-16.1}}
.livecard{display:flex;gap:12px;align-items:center;padding:10px 14px 10px 8px}
.livecard>svg:first-child{width:96px;height:150px;flex:none;display:block}
.bo{stroke:var(--bone-line);fill:none;stroke-linecap:round}.bf{stroke:var(--bone);fill:none;stroke-linecap:round}
.bs{fill:var(--bone);stroke:var(--bone-line);stroke-width:1}.br{stroke:var(--bone-line);stroke-width:1.3;fill:none;stroke-linecap:round}.bh{fill:var(--bone-line);opacity:.55}
.mline{stroke:var(--acc);stroke-width:1.8;fill:none;stroke-linecap:round}.mtk{stroke:var(--acc);stroke-width:1.4}.mseg{stroke:var(--acc);stroke-width:1.2;opacity:.5;stroke-dasharray:3 3}
.mo{fill:none;stroke:var(--acc);stroke-width:1.6}.mt{font-weight:600;fill:var(--acc);stroke:var(--map);stroke-width:1.4px;paint-order:stroke;font-family:Inter,sans-serif}
.crop{width:100%;height:auto;display:block;background:var(--map);border-radius:var(--r-l)}
.ring{width:150px;height:150px;margin:0 auto;display:block}
.prog{height:6px;border-radius:3px;background:var(--line)}
.prog i{display:block;height:6px;border-radius:3px;background:var(--acc);width:0}
.clockwrap{display:none}
/* légzés */
.breath{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:12px auto 0}
.breath .r1,.breath .r2,.breath .core{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.breath .r1{width:100%;height:100%;background:var(--bl)}
.breath .r2{width:78%;height:78%;background:color-mix(in srgb,var(--bc) 30%,var(--bl))}
.breath .core{width:56%;height:56%;background:var(--bc);color:var(--onacc);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translate(-50%,-50%) scale(.6)}
.breath .core .n{font-family:'Inter Tight',Inter,sans-serif;font-weight:700;font-size:48px;line-height:1.1}
/* lejátszó */
.player{min-height:100vh;background:var(--bg);color:var(--on);display:flex;flex-direction:column;padding:0 16px 24px}
.phead{display:flex;align-items:center;gap:8px;padding:14px 0 4px}
.phead .t{font-size:15px;font-weight:700}
.pring{position:relative;width:min(270px,72vw);aspect-ratio:1;margin:8px auto 0;transition:opacity .3s}
.pring svg{width:100%;height:100%;display:block}
#pringc{transition:stroke-dashoffset .25s linear}
.pmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ptime{font-family:'Inter Tight',Inter,sans-serif;font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1.5px}
.pside{margin-top:8px;padding:5px 14px;border-radius:14px;background:var(--surf2);font-size:14px;font-weight:700;color:var(--acc)}
.pside:empty{display:none}
.pbody{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.pinfo{display:flex;gap:12px;align-items:center}
.pcropbox{width:112px;flex:none;border-radius:18px;overflow:hidden;background:var(--map)}
.pcrop{width:100%;height:auto;display:block}
.parea{font-family:'Inter Tight',Inter,sans-serif;font-weight:700;font-size:26px;line-height:30px;letter-spacing:-.3px}
.ptech{font-size:15px;line-height:21px;color:var(--mut);margin-top:4px}
.pctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:4px}
.round{width:64px;height:64px;border-radius:32px;border:0;background:var(--surf2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--on)}
.bigplay{width:96px;height:96px;border-radius:34px;border:0;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pdots{display:flex;justify-content:center;gap:8px}
.pdots span{width:10px;height:10px;border-radius:5px;background:var(--surf2)}
.pdots span.on{width:28px;background:var(--acc)}.pdots span.ok{background:var(--mut)}
.ptoggles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pdone{text-align:center;padding:8px 0}
.pdone p{margin:6px 0 0;font-size:16px}
.pover{background:var(--surf);border-radius:var(--r-l);padding:12px 16px}
.pover summary{cursor:pointer;font-weight:700;font-size:14px;min-height:28px}
.psteps{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:24px}
.player.eyes .ph{display:none}
.player.eyes .parea{font-size:34px;line-height:40px;text-align:center}
.player.eyes .pinfo{justify-content:center}
.player.eyes .ptech{display:none}
.player.eyes .bigplay{width:140px;height:140px;border-radius:48px}
@media (prefers-reduced-motion:reduce){.anim,.breath .core,#pringc,body{transition:none!important}.fdots,.fcore{animation:none}.sheet,.scrim{animation:none}}

/* kijelző mód */
.kij{position:fixed;inset:0;background:var(--bg);color:var(--on);overflow:hidden;z-index:30;display:flex;flex-direction:column;cursor:default}
.kij.dim .kbody{opacity:.55}
.kctl{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;padding:14px 16px;opacity:0;transition:opacity .4s;z-index:2}
.kij.show .kctl,.kij.show .kstatus{opacity:1}
.kbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;transition:transform 2s ease,opacity .6s}
.kclock{font-family:'Inter Tight',Inter,sans-serif;font-weight:700;font-size:min(26vw,120px);line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.kdate{font-size:15px;color:var(--mut);margin-top:6px}
.kmain{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:22px;width:100%;max-width:640px}
.kfig svg{height:min(34vh,300px);width:auto;display:block}
.kinfo{width:100%;max-width:360px}
.korg{font-family:'Inter Tight',Inter,sans-serif;font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-1px;color:var(--acc);margin:4px 0 4px}
.kbar{height:6px;border-radius:3px;background:var(--surf2);margin:10px 0 12px}.kbar i{display:block;height:6px;border-radius:3px;background:var(--acc)}
.kline{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.kmut{color:var(--mut);margin-top:10px;font-weight:500}
.kstatus{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:var(--mut);padding:0 24px;opacity:0;transition:opacity .4s}
@media (orientation:landscape) and (max-height:600px){.kbody{flex-direction:row;gap:32px}.kmain{flex-direction:row;margin-top:0;width:auto}.kclock{font-size:min(16vw,110px)}.kfig svg{height:min(64vh,280px)}.kleft{display:flex;flex-direction:column}}
@media (prefers-reduced-motion:reduce){.kbody{transition:none}}

/* asztrológia */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pillar{background:var(--surf);border-radius:18px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.pillar.dm{background:var(--cont)}
.pillar .k{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
.pz{font-size:30px;line-height:36px;color:var(--on)}
.pe{font-size:12px;display:flex;align-items:center;gap:4px;line-height:16px;text-align:left}
.pw{font-size:11px;color:var(--acc);font-weight:600;line-height:14px;margin-top:2px}
.ebar{display:grid;grid-template-columns:52px 1fr 40px auto;align-items:center;gap:8px;font-size:14px}
.ebar .en{font-weight:600}.ebar .et{height:10px;border-radius:5px;background:var(--surf2);display:flex;overflow:hidden}.ebar .et i{display:block;height:10px}
.ebar .ev{font-weight:700;font-variant-numeric:tabular-nums}
.hl{margin:8px 0 0;padding-left:18px;font-size:15px;line-height:22px}.hl li{margin-bottom:8px}
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.agrid a{background:var(--surf);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;font-size:11px;line-height:14px;color:var(--mut)}
.agrid a b{font-size:13px;color:var(--on);margin:2px 0}.agrid a .han{font-size:18px;color:var(--on);line-height:22px}
.agrid a.my{background:var(--cont);box-shadow:inset 0 0 0 2px var(--acc)}
.agrid a span{overflow-wrap:anywhere;hyphens:auto}

/* 3D és fotó */
.map3{cursor:grab}.map3 canvas{position:absolute;inset:0;display:block;touch-action:none}

.hint3{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--mut);background:var(--surf);padding:4px 10px;border-radius:12px;pointer-events:none}
.fstage{border-radius:var(--r-l);overflow:hidden;background:var(--map)}.fstage canvas{display:block;cursor:crosshair;touch-action:manipulation}
.fstep{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.map3{height:min(64vh,580px)}

function dayArc(d) {

  let s = ''; const MYB = astroOn() ? [...new Set(bazi(getBirth()).P.map((p) => p[1]))] : [];
  for (let k = -6; k <= 5; k++) {
    const o = ORG[(cur + k + 12) % 12], c = 270 + k * 15, a0 = c - 6.6, a1 = c + 6.6, on = k === 0, w = on ? 36 : 22, ro = R + (on ? 7 : 0), ri = ro - w;
    const [x0, y0] = pt(ro, a0), [x1, y1] = pt(ro, a1), [x2, y2] = pt(ri, a1), [x3, y3] = pt(ri, a0);
    s += `<a href="#szerv-${slug(o.c)}" aria-label="${esc(orgN(o.c))}, ${t('hours', { w: win(o) })}"><path d="M${x0} ${y0} A${ro} ${ro} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${ri} ${ri} 0 0 0 ${x3} ${y3} Z" style="fill:var(--${o.el})" opacity="${on ? 1 : k < 0 ? 0.3 : 0.62}"/></a>`;
    if (astroOn() && MYB.includes(ORG.indexOf(o))) { const [mx, my] = pt(ri - 9, c); s += `<circle cx="${mx}" cy="${my}" r="4" style="fill:var(--${o.el})"><title>${esc(t('my_windows'))}</title></circle>`; }
    if (k >= 1 && k <= 2) { const [tx, ty] = pt(R + 14, c); s += `<text x="${tx}" y="${ty}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--mut)" transform="rotate(${c - 270} ${tx} ${ty})">${C('org', o.c)[1]}</text>`; }
  }

}

const boneRows = (p) => { if (!L.csontok) return ''; const m = measureText(p); return `<div class="kv"><div class="k">${t('k_bone')}</div><div class="v">${m.bone}</div></div><div class="kv"><div class="k">${t('k_from')}</div><div class="v">${m.from}</div></div><div class="kv"><div class="k">${t('k_meas')}</div><div class="v">${m.meas}</div></div>`; };
let tech = 'ton';
const techCard = () => { const tc = C('tech', tech); return `<div style="font-size:14px;font-weight:600;color:var(--jade-t);margin-bottom:4px">${tc[0]}</div>${tc[1].map(([k, v]) => `<div class="kv"><div class="k">${k.toUpperCase()}</div><div class="v">${v}</div></div>`).join('')}`; };
function initTimer(signal) {
  let dur = 60, left = 60, run = false, last = 0, iv = null;
  const ring = $('#ringp'), txt = $('#ringt'), go = $('#tgo'), msg = $('#tmsg');
  const draw = () => { ring.setAttribute('stroke-dashoffset', (326.7 * (1 - left / dur)).toFixed(1)); txt.textContent = mmss(Math.ceil(left)); };
  const label = () => { go.innerHTML = `${ic(run ? 'pause' : 'play', 16, 2)}${t(run ? 'pause' : left < dur && left > 0 ? 'resume' : 'start')}`; };
  const stop = () => { run = false; clearInterval(iv); label(); };
  const tick = () => { const n = performance.now(); left -= (n - last) / 1000; last = n; if (left <= 0) { left = 0; draw(); stop(); msg.textContent = t('timer_done'); buzz([200, 100, 200]); beep(660, .25); return; } draw(); };
  $('#view').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === 'tgo') { if (run) { stop(); return; } audio(); if (left <= 0) left = dur; run = true; last = performance.now(); msg.textContent = t('timer_run'); label(); iv = setInterval(tick, 200); }
    if (a === 'treset') { stop(); left = dur; msg.textContent = ''; draw(); label(); }
    if (a === 'tdur') { stop(); dur = left = +b.dataset.k; $$('[data-act=tdur]').forEach((x) => x.setAttribute('aria-pressed', x === b)); msg.textContent = ''; draw(); label(); }
    if (a === 'tech') { tech = b.dataset.k; $$('[data-act=tech]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#techcard').innerHTML = techCard(); }
  }, { signal });
  signal.addEventListener('abort', () => clearInterval(iv));
  draw();
}

/* ---- hang és rezgés ---- */
let AC = null;
const audio = () => { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } };
const beep = (f = 520, d = .18, when = 0) => { if (!AC || !store.get('sound', true)) return; try { const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + when; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.05); } catch (e) {} };
const buzz = (p) => { if (!store.get('vibrate', true)) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const PATS = { calm: [['inhale', 4, 'in'], ['exhale', 6, 'out']], even: [['inhale', 5, 'in'], ['exhale', 5, 'out']], sleep: [['inhale', 4, 'in'], ['hold', 7, 'hold'], ['exhale', 8, 'out']] };
let brPat = 'calm', brCycles = 8;
function initBreath(signal) {
  if (!$('#core')) return;
  const core = $('#core'), ph = $('#phase'), numEl = $('#num'), go = $('#brgo'), prog = $('#brprog');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let run = false, i = 0, cyc = 0, elapsed = 0, last = 0, iv = null;
  const P = () => PATS[brPat], total = () => P().reduce((s, x) => s + x[1], 0);
  const setPhase = (rem) => { const [n, , ty] = P()[i]; ph.textContent = t(n); const sc = ty === 'in' ? 1 : ty === 'out' ? .6 : null; if (sc !== null) { core.style.transition = reduce ? 'none' : `transform ${rem}s ease-in-out`; core.style.transform = `translate(-50%,-50%) scale(${sc})`; } };
  const ui = () => { const d = P()[i][1]; numEl.textContent = Math.max(1, Math.ceil(d - elapsed)); const done = cyc * total() + P().slice(0, i).reduce((s, x) => s + x[1], 0) + elapsed; prog.style.width = Math.min(100, done / (total() * brCycles) * 100) + '%'; $('#brcyc').textContent = t('cyc_of', { a: Math.min(cyc + 1, brCycles), b: brCycles }); $('#brleft').textContent = t('left_t', { t: mmss(Math.max(0, total() * brCycles - done)) }); };
  const finish = (ok) => { run = false; clearInterval(iv); i = 0; cyc = 0; elapsed = 0; core.style.transition = reduce ? 'none' : 'transform 1s ease'; core.style.transform = 'translate(-50%,-50%) scale(.6)'; ph.textContent = t(ok ? 'done' : 'ready'); numEl.textContent = ok ? '✓' : P()[0][1]; prog.style.width = ok ? '100%' : '0'; go.innerHTML = `${ic('play', 16, 2)}${t('start')}`; if (ok) { $('#brhint').textContent = t('breath_done'); beep(660, .3); } };
  const tick = () => { const n = performance.now(); elapsed += (n - last) / 1000; last = n; if (elapsed >= P()[i][1]) { elapsed = 0; i++; if (i >= P().length) { i = 0; cyc++; if (cyc >= brCycles) { finish(true); return; } } setPhase(P()[i][1]); } ui(); };
  const pause = () => { run = false; clearInterval(iv); const m = getComputedStyle(core).transform; core.style.transition = 'none'; if (m !== 'none') core.style.transform = m; go.innerHTML = `${ic('play', 16, 2)}${t('resume')}`; };
  $('#view').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === 'brgo') { if (run) { pause(); return; } audio(); run = true; last = performance.now(); setPhase(P()[i][1] - elapsed); go.innerHTML = `${ic('pause', 16, 2)}${t('pause')}`; ui(); iv = setInterval(tick, 100); }
    if (a === 'brstop') finish(false);
    if (a === 'pat') { brPat = b.dataset.k; $$('[data-act=pat]').forEach((x) => x.setAttribute('aria-pressed', x === b)); finish(false); }
    if (a === 'brcyc') { brCycles = brCycles === 6 ? 8 : brCycles === 8 ? 12 : 6; $('#brcycl').textContent = brCycles + '×'; $('#brcount').textContent = t('cycles_n', { n: brCycles }); finish(false); $('#brcyc').textContent = t('cyc_of', { a: 0, b: brCycles }); }
  }, { signal });
  signal.addEventListener('abort', () => clearInterval(iv));
}

V.technikak = () => {
  const T = C('tech');
  const dots = (n) => `<div style="display:flex;gap:3px;justify-content:center">${[0, 1, 2].map((i) => `<span class="dot" style="width:8px;height:8px;background:${i < n ? 'var(--jade)' : 'var(--line)'}"></span>`).join('')}</div>`;
  const ing = (n, [a, b]) => `<div style="flex:1;padding:10px 6px;border-radius:12px;background:var(--bg);text-align:center">${dots(n)}<div style="font-size:14px;font-weight:600;margin-top:6px">${a}</div><div style="font-size:12px;color:var(--muted)">${b}</div></div>`;
  const finger = (w) => `<span style="display:block;width:${w}px;height:34px;border-radius:9px 9px 4px 4px;background:var(--body);border:1.5px solid var(--body-line)"></span>`;
  const cun = (n, k, w, cap) => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:14px;font-weight:600;color:var(--jade-t)">${num(n)} ${T.cun_u}</div><div style="align-self:stretch;height:6px;border:1.5px solid var(--jade-t);border-bottom:0;margin:0 4px"></div><div style="display:flex;gap:1px">${Array.from({ length: k }, () => finger(w)).join('')}</div><div style="font-size:12px;color:var(--muted);text-align:center">${cap}</div></div>`;
  return `${top(t('tech_title'), t('tech_sub'), 'gyakorlat')}
  <section class="pad stack">
    <div class="card"><h2>${T.intensity}</h2><div style="display:flex;gap:6px;margin-top:10px">${T.ing.map((x, i) => ing(i + 1, x)).join('')}</div><p style="margin:10px 0 0;font-size:14px;line-height:20px;color:var(--muted)">${T.ing_note}</p></div>
    <div class="sec"><h2>${T.grips}</h2><span>${T.grips_n}</span></div>
    <div class="list">${T.fog.map(([n, z, d], i) => `<div class="li" style="align-items:flex-start"><span style="width:28px;height:28px;border-radius:14px;background:var(--chip);color:var(--jade-t);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none">${i + 1}</span><span class="grow"><span style="display:block;font-size:15px;font-weight:600">${n} <span style="font-weight:400;color:var(--muted);font-size:13px">(${z})</span></span><span style="display:block;font-size:14px;color:var(--muted);line-height:20px">${d}</span></span></div>`).join('')}</div>
    <div class="card"><h2>${T.cun}</h2><p style="margin:4px 0 12px;font-size:14px;line-height:20px;color:var(--muted)">${T.cun_note}</p><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end">${cun(1, 1, 22, T.cun_caps[0])}${cun(1.5, 2, 15, T.cun_caps[1])}${cun(2, 3, 14, T.cun_caps[2])}${cun(3, 4, 13, T.cun_caps[3])}</div></div>
    <div class="card"><h2>${t('bones_h')}</h2><p style="margin:4px 0 10px;font-size:14px;line-height:20px;color:var(--muted)">${t('bones_note')}</p>
      <div class="list" style="border-radius:12px">${Object.entries(SEG).filter(([, x]) => !x[4]).map(([k, [a, b, len]]) => `<div class="li" style="min-height:44px;padding:8px 12px"><span class="grow" style="font-size:14px">${C('lm', a)} – ${C('lm', b)}</span><b style="white-space:nowrap">${len} cun</b></div>`).join('')}${C('cun_extra').map(([n, len]) => `<div class="li" style="min-height:44px;padding:8px 12px"><span class="grow" style="font-size:14px">${n}</span><b style="white-space:nowrap">${len} cun</b></div>`).join('')}</div></div>
    <div class="card"><h2>${T.open}</h2><p style="margin:4px 0 0;font-size:14px;line-height:20px">${T.open_txt}</p></div>
    <div class="card" style="background:var(--warn);border-color:var(--warn-line)"><h2 style="display:flex;align-items:center;gap:8px;color:var(--tuz-t)">${ic('warn', 20)}<span style="color:var(--ink)">${T.contra}</span></h2><ul style="margin:8px 0 0;padding-left:18px;font-size:14px;line-height:22px">${T.contra_list.map((x) => `<li>${x}</li>`).join('')}</ul><p class="note">${T.contra_note}</p></div>
  </section>`;
};

/* ================= útválasztó ================= */
const TABS = [['ma', 'tab_ma', 'today'], ['test', 'tab_test', 'body'], ['gyakorlat', 'tab_prac', 'practice'], ['tudas', 'tab_know', 'graph'], ['naplo', 'tab_log', 'journal']];
const GROUP = { ma: 'ma', kijelzo: 'ma', foto: 'test', szerv: 'ma', beallitasok: 'ma', test: 'test', pont: 'test', gyakorlat: 'gyakorlat', rutin: 'gyakorlat', technikak: 'gyakorlat', tudas: 'tudas', elem: 'tudas', naplo: 'naplo' };
let ac = null, tickIv = null, lastHash = '';
function route() {
  const h = (location.hash.slice(1) || 'ma').toLowerCase();
  const i = h.indexOf('-'); let name = i < 0 ? h : h.slice(0, i); let arg = i < 0 ? '' : h.slice(i + 1);
  if (!V[name]) { name = 'ma'; arg = ''; }
  if (ac) ac.abort(); ac = new AbortController(); clearInterval(tickIv); closeSheet();
  document.documentElement.lang = lang; applyTheme(); layout();
  $('#view').innerHTML = V[name](arg);
  const immersive = name === 'rutin' || name === 'kijelzo'; document.body.classList.toggle('immersive', immersive);
  const nav = $('#nav'); nav.setAttribute('aria-label', t('nav_l'));
  nav.innerHTML = TABS.map(([href, n, icn]) => { const on = GROUP[name] === href; return `<a href="#${href}"${on ? ' aria-current="page"' : ''}><span class="ind">${ic(icn, 22, on ? 2.1 : 1.8)}</span><span>${t(n)}</span></a>`; }).join('');
  if (h !== lastHash) window.scrollTo(0, 0); lastHash = h;
  const sig = ac.signal;
  if (name === 'test') initTest(sig);
  if (name === 'foto') initFoto(sig);
  if (name === 'pont') initTimer(sig);
  if (name === 'gyakorlat') { initBreath(sig); if (arg === 'legzes') { const el = $('#legzes'); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 0); } }
  if (name === 'rutin') initPlayer(sig, arg);
  if (name === 'kijelzo') initKijelzo(sig);
  if (name === 'ma') tickIv = setInterval(() => { if (!document.hidden && !$('#sheetbox .sheet')) { const y = window.scrollY; applyTheme(); $('#view').innerHTML = V.ma(); window.scrollTo(0, y); } }, 30000);
  document.title = `${t(name === 'ma' ? 'app' : ({ szerv: 'organ_details', test: 'tab_test', pont: 'tab_test', gyakorlat: 'tab_prac', rutin: 'routine_label', technikak: 'tech_title', tudas: 'tab_know', elem: 'el_details', naplo: 'tab_log', beallitasok: 'settings_t', kijelzo: 'kij_open', foto: 'foto_t' })[name])} – ${t('app')}`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'checkin') openSheet();
  if (a === 'ciclose') closeSheet();
  if (a === 'ci') { CI[b.dataset.k] = +b.dataset.v; $$(`#sheetbox [data-act=ci][data-k="${b.dataset.k}"]`).forEach((x) => x.setAttribute('aria-checked', x === b)); const rec = recommend(now(), CI); $('#cirec').textContent = `${rec.ti} · ${t('min_n', { n: Math.max(1, Math.round(rec.r.sec / 60)) })}`; $('#cigo').dataset.r = rec.id; }
  if (a === 'cisave') { saveCheckin(); closeSheet(); route(); }
  if (a === 'cigo') { saveCheckin(); closeSheet(); location.hash = 'rutin-' + b.dataset.r; }
  if (a === 'cyc') { elemCyc = b.dataset.k; $$('[data-act=cyc]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#cycfig').innerHTML = cycleSvg(elemCyc); $('#cyctext').innerHTML = cycText(); }
  if (a === 'lexel') { lexEl = b.dataset.k; $$('[data-act=lexel]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#lexlist').innerHTML = lexList(); }
  if (a === 'lyreset') { L = Object.assign({}, DEFAULT_LAYERS); store.set('layers', L); route(); }
  if (a === 'lang') { lang = b.dataset.k; store.set('lang', lang); route(); }
  if (a === 'model') { MODEL = b.dataset.k; store.set('model', MODEL); route(); }
  if (a === 'theme') { store.set('theme', b.dataset.k); route(); }
  if (a === 'wakeadd') { const [hh, mm] = ($('#waket').value || '02:00').split(':').map(Number); const d = new Date(+b.dataset.base); d.setHours(hh, mm, 0, 0); if (hh >= 18) d.setDate(d.getDate() - 1); const l = getLog(); l.push({ type: 'wake', t: d.getTime() }); setLog(l); route(); }
  if (a === 'sample') { setLog(getLog().filter((x) => !x.demo).concat(sampleData()).sort((x, y) => x.t - y.t)); route(); }
  if (a === 'clearlog') { setLog([]); route(); }
  if (a === 'tmode') { TS.mode = b.dataset.k; store.set('tmode', TS.mode); route(); }
  if (a === 'freg') { FS.reg = b.dataset.k; FS.lm = {}; FS.sel = null; route(); }
  if (a === 'fundo') { const r = FREG.find((x) => x.k === FS.reg), done = fregLms(r).filter((l) => FS.lm[l]); if (done.length) delete FS.lm[done[done.length - 1]]; FS.sel = null; route(); }
  if (a === 'freset') { FS.lm = {}; FS.sel = null; route(); }
  if (a === 'fflip') { FS.flip = -FS.flip; route(); }
  if (a === 'fsel' && !e.target.closest('a')) { FS.sel = b.dataset.k; route(); }
  if (a === 'btz') { $$('[data-act=btz]').forEach((x) => x.setAttribute('aria-pressed', x === b)); }
  if (a === 'bsave') { const dt = $('#bdate').value, tm = $('#btime').value, lon = parseFloat($('#blon').value), tzb = $('[data-act=btz][aria-pressed=true]'); if (!dt || !tm || isNaN(lon) || lon < -180 || lon > 180) { $('#bmsg').textContent = t('birth_err'); return; } store.set('birth', { date: dt, time: tm, lon, tz: tzb ? +tzb.dataset.k : 1 }); astroEdit = false; L.asztro = true; store.set('layers', L); route(); }
  if (a === 'bedit') { astroEdit = true; route(); }
  if (a === 'bcancel') { astroEdit = false; route(); }
  if (a === 'bclear') { store.set('birth', null); astroEdit = false; route(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheetbox .sheet')) closeSheet(); });
document.addEventListener('input', (e) => { if (e.target.id === 'lexq') { lexQ = e.target.value; $('#lexlist').innerHTML = lexList(); } });
document.addEventListener('change', (e) => {
  const ds = e.target.dataset || {};
  if (ds.layer) { L[ds.layer] = e.target.checked; store.set('layers', L); }
  if (ds.pref) store.set(ds.pref, e.target.checked);
});
window.addEventListener('hashchange', route);
route();

}
</script>
